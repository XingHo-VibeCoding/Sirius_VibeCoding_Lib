<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img">
  <title>云函数 api · 后端分层结构图</title>
  <desc>后端从"一个 737 行的文件"拆成四层：HTTP 请求先经接口层接请求，再调数据访问层（repositories 目录下的三个文件）查表，回到接口层塑形，最后包上信封返回。判据是"这段代码知不知道数据库的表名和列名"。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="760" fill="#FFFFFF"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">

    <text x="60" y="46" font-size="20" font-weight="500" fill="#2C2C2A">后端分层结构图 · 一次请求穿过哪些层</text>
    <text x="60" y="72" font-size="13" fill="#5F5E5A">云函数 api ｜ Day 19 分层重构 ｜ 判据：这段代码知不知道数据库的表名和列名？</text>

    <rect x="40" y="96" width="560" height="286" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="62" y="124" font-size="15" font-weight="500" fill="#0C447C">接口层 · cloudfunctions/api/index.js</text>
    <text x="62" y="146" font-size="12.5" fill="#185FA5">不懂数据库，只懂 HTTP 和接口字段｜本文件里一个 db. 都不出现</text>

    <rect x="62" y="162" width="516" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
    <text x="80" y="182" font-size="13" font-weight="500" fill="#042C53">① 接请求</text>
    <text x="80" y="196" font-size="12" fill="#0C447C">parseQuery · readJsonBody · getMethod · resolveRequest</text>

    <rect x="62" y="210" width="516" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
    <text x="80" y="230" font-size="13" font-weight="500" fill="#042C53">② 调函数（不查库，只下命令）</text>
    <text x="80" y="244" font-size="12" fill="#0C447C">bodiesRepo.findById(id) ｜ sourcesRepo.urlMap()</text>

    <rect x="62" y="258" width="516" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
    <text x="80" y="278" font-size="13" font-weight="500" fill="#042C53">③ 塑形：snake_case 列 → camelCase 字段</text>
    <text x="80" y="292" font-size="12" fill="#0C447C">toDetail(row, srcUrls) · num · bool · isoUtc</text>

    <rect x="62" y="306" width="516" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
    <text x="80" y="326" font-size="13" font-weight="500" fill="#042C53">④ 返响应：包信封 + 错误码翻译</text>
    <text x="80" y="340" font-size="12" fill="#0C447C">ok(data) ｜ errNotFound ｜ isDuplicateError（认 23505 → 中文）</text>

    <text x="62" y="366" font-size="12" fill="#185FA5">校验（validateObservation）与 id 生成（uuidv4）也在这层</text>

    <rect x="628" y="96" width="292" height="286" rx="14" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="648" y="124" font-size="15" font-weight="500" fill="#791F1F">数据访问层 · repositories/</text>
    <text x="648" y="146" font-size="12.5" fill="#A32D2D">只有这一列知道表名和列名</text>

    <rect x="648" y="160" width="252" height="52" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="664" y="180" font-size="12.5" font-family="monospace" fill="#501313">bodiesRepository.js</text>
    <text x="664" y="200" font-size="12" fill="#791F1F">listAll · existsById · findById</text>

    <rect x="648" y="220" width="252" height="52" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="664" y="240" font-size="12.5" font-family="monospace" fill="#501313">sourcesRepository.js</text>
    <text x="664" y="260" font-size="12" fill="#791F1F">urlMap（读 4 行 + 内存映射）</text>

    <rect x="648" y="280" width="252" height="52" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="664" y="300" font-size="12.5" font-family="monospace" fill="#501313">observationsRepository.js</text>
    <text x="664" y="320" font-size="12" fill="#791F1F">insert</text>

    <line x1="628" y1="350" x2="628" y2="350" stroke="#A32D2D" stroke-width="0.8"/>

    <path d="M578 232 H628" fill="none" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="586" y="224" font-size="11.5" fill="#185FA5">调用</text>

    <rect x="40" y="404" width="880" height="118" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="62" y="432" font-size="15" font-weight="500" fill="#2C2C2A">repositories/db.js · 建数据库连接实例（全项目唯一一处）</text>

    <rect x="62" y="446" width="836" height="60" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.8"/>
    <text x="82" y="468" font-size="12.5" fill="#2C2C2A">cloudbase.init({ env, accessKey: process.env.CLOUDBASE_APIKEY }) → app.rdb({ database: 'public' })</text>
    <text x="82" y="490" font-size="12" fill="#444441">三个 repository 都 require 它；实例只建一次 ⇒ SDK 只被 require 1 次、init 只调 1 次、"未配置 API Key"警告只打 1 遍（已实测）</text>

    <path d="M540 350 V404" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="552" y="382" font-size="11.5" fill="#A32D2D">取实例</text>

    <rect x="40" y="544" width="880" height="76" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="62" y="572" font-size="15" font-weight="500" fill="#085041">PostgreSQL（public schema）</text>
    <text x="62" y="596" font-size="12.5" fill="#0F6E56">sources 4 行 ｜ bodies 11 行 ｜ observations 0 行起（用户写）— 三张表、20 条约束，本次重构一行 DDL 都没动</text>

    <path d="M480 522 V544" fill="none" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arw2)"/>

    <path d="M120 96 V78 H480 V96" fill="none" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
    <text x="128" y="72" font-size="12" fill="#5F5E5A">HTTP 请求进来（GET /api/bodies?id=moon）</text>

    <path d="M858 96 V78 H600 V96" fill="none" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="700" y="72" font-size="12" fill="#5F5E5A">响应原路返回</text>

    <line x1="60" y1="656" x2="900" y2="656" stroke="#D3D1C7" stroke-width="0.8"/>
    <text x="60" y="680" font-size="12.5" fill="#5F5E5A">分层的收益：换一张表、加一个字段，只动 repositories/ 里那一个文件 —— 接口逻辑一行都不用碰。</text>
    <text x="60" y="702" font-size="12.5" fill="#5F5E5A">重构前后 39 条接口请求逐字节一致（含 limit 九种写法、POST 七种错误场景）；两条通道（公网 + fn invoke）结果一致。</text>
    <text x="60" y="726" font-size="12.5" fill="#5F5E5A">本次只搬位置、不改行为：接口形状、数据库结构、resolveRequest 的四写法分流、isDuplicateError 的 23505 判据，全部原样。</text>

  </g>
</svg>
