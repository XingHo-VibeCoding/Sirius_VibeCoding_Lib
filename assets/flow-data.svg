<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img">
  <title>太阳系科普网页 · 数据流图</title>
  <desc>数据从 NASA 官方资料出发，经人工抄录核对固定进项目数据文件，随页面抵达浏览器，最终渲染为用户屏幕上的画面，全程不经过任何服务器。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" fill="#FFFFFF"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">

    <text x="60" y="50" font-size="20" font-weight="500" fill="#2C2C2A">数据流图 · 数据从哪来、到哪去</text>
    <text x="60" y="76" font-size="13" fill="#5F5E5A">太阳系科普网页 ｜ Day 5 技术设计 ｜ 纯静态网页：无后端、无数据库、无网络请求</text>

    <rect x="140" y="106" width="480" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="164" y="134" font-size="16" font-weight="500" fill="#085041">① NASA 官方资料</text>
    <text x="164" y="158" font-size="13" fill="#0F6E56">Planetary Fact Sheet（Metric） · Values compared to Earth</text>

    <line x1="380" y1="178" x2="380" y2="210" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="396" y="198" font-size="13" fill="#5F5E5A">人工抄录</text>

    <rect x="140" y="214" width="480" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.4"/>
    <text x="164" y="244" font-size="16" font-weight="500" fill="#633806">② 人工抄录 + 逐条核对来源</text>
    <text x="164" y="270" font-size="13" fill="#854F0B">本项目数据链里唯一靠人的环节</text>

    <line x1="380" y1="296" x2="380" y2="328" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="396" y="316" font-size="13" fill="#5F5E5A">固定进项目文件</text>

    <rect x="140" y="332" width="480" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="164" y="360" font-size="16" font-weight="500" fill="#0C447C">③ src/data/bodies.js</text>
    <text x="164" y="384" font-size="13" fill="#185FA5">天体数据，每条数值都带 source 标注（唯一数据源）</text>

    <line x1="380" y1="404" x2="380" y2="436" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="396" y="424" font-size="13" fill="#5F5E5A">随页面一起加载</text>

    <rect x="140" y="440" width="480" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="164" y="470" font-size="16" font-weight="500" fill="#0C447C">④ 渲染层（三个模块）</text>
    <text x="164" y="494" font-size="13" fill="#185FA5">scene2d.js 画 2D 主图 ｜ focus3d.js 出 3D 特写 ｜ guide.js 出引导词</text>
    <text x="164" y="514" font-size="13" fill="#185FA5">运行时不发任何网络请求</text>

    <line x1="380" y1="532" x2="380" y2="564" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="140" y="568" width="480" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="164" y="596" font-size="16" font-weight="500" fill="#085041">⑤ 用户屏幕</text>
    <text x="164" y="620" font-size="13" fill="#0F6E56">2D 轨道主图 · 3D 天体特写 · 中文引导词</text>

    <path d="M140 603 H80 V485 H136" fill="none" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
    <text x="88" y="536" font-size="12" fill="#5F5E5A">用户操作</text>

    <line x1="622" y1="141" x2="656" y2="141" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="664" y="134" font-size="12.5" fill="#444441">数据源已核实：含 Diameter、</text>
    <text x="664" y="151" font-size="12.5" fill="#444441">Distance from Sun、Orbital Period</text>

    <line x1="622" y1="254" x2="656" y2="254" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="664" y="247" font-size="12.5" fill="#854F0B">注意：抄错一个数，程序不会有</text>
    <text x="664" y="264" font-size="12.5" fill="#854F0B">任何报错——这是最大风险点</text>

    <line x1="622" y1="367" x2="656" y2="367" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="664" y="360" font-size="12.5" fill="#444441">只放数据、不放逻辑</text>
    <text x="664" y="377" font-size="12.5" fill="#444441">—— 便于逐条核对</text>

    <line x1="622" y1="485" x2="656" y2="485" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="664" y="478" font-size="12.5" fill="#444441">数据是只读的：用户操作</text>
    <text x="664" y="495" font-size="12.5" fill="#444441">只改变画面，不改变数据</text>

    <line x1="622" y1="603" x2="656" y2="603" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="664" y="596" font-size="12.5" fill="#444441">用户的每次操作都回流到</text>
    <text x="664" y="613" font-size="12.5" fill="#444441">渲染层，再变成新的画面</text>

    <line x1="60" y1="664" x2="900" y2="664" stroke="#D3D1C7" stroke-width="0.8"/>
    <text x="60" y="688" font-size="12.5" fill="#5F5E5A">数据不会去的地方：后端服务器（没有）· 数据库（没有要存的东西）· 第三方接口（不引星历）· 浏览器本地存储（不做写入功能）</text>

  </g>
</svg>
