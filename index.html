<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重走太阳系 · 可交互的太阳系科普网页</title>
  <meta name="description" content="用图形、动画和中文引导词，帮你一点点看懂太阳系。">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page-state="loading">

  <!-- 过渡屏（Day 8 新增）——网页名 + 网页介绍 + 「加载中」状态三合一。
       它同时承担四种状态里的 loading：等主视图真的画出天体了才退场。
       显隐由 src/states.js 控制；styles/main.css 里另有一条
       不依赖 JS 的 4 秒兜底，保证它绝不会永远挡着页面。 -->
  <div id="intro-overlay" class="intro-overlay" role="status" aria-live="polite">
    <div class="intro-sun" aria-hidden="true"></div>
    <p class="intro-name">重走太阳系</p>
    <p class="intro-tagline">当文字科普太晦涩时，用图形和引导，一点点看懂太阳系。</p>
    <p class="intro-loading"><span class="intro-dot" aria-hidden="true"></span>正在准备太阳系…</p>
  </div>

  <header class="page-header">
    <h1>重走太阳系</h1>
    <p class="subtitle">用图形和引导，一点点看懂太阳系 · Day 8 试做中</p>
  </header>

  <main id="scene-wrap">
    <svg id="solar-scene" viewBox="-450 -450 900 900" role="img"
         aria-labelledby="scene-title scene-desc">
      <title id="scene-title">太阳系 2D 轨道图</title>
      <desc id="scene-desc">太阳位于中心，行星沿各自的椭圆轨道绕太阳运行。</desc>
    </svg>

    <!-- 主图区的状态层（Day 8 第 4 步）。
         数据取不到（error）或数据是空的（empty）时，主图上会是空白 ——
         空白最让人困惑，所以要有一条说明这里发生了什么。
         显隐完全由 CSS 读 <body data-page-state> 决定，
         脚本不用管它；这样"状态"和"样子"是分开的。

         两种状态各说各的话：
           error —— 出错了，给一个「重新加载」按钮（用户有可做的事）
           empty —— 本来就没有内容，给按钮也没用，只说明情况 -->
    <div id="scene-state" class="scene-state">
      <p class="scene-state-text" data-when="empty">暂时没有可显示的天体资料，主图是空的。</p>
      <p class="scene-state-text" data-when="error">太阳系主图没能加载成功。</p>
      <button id="scene-state-retry" class="scene-state-retry" type="button"
              data-when="error">重新加载</button>
    </div>
  </main>

  <!-- 调控区（PRD F3「教学机关」）。
       三块控件：时间流速 / 尺度切换 / 教学对比。
       按钮由 src/controls.js 按 SOLAR_CONFIG 里的档位生成，
       这样改档位只需要改数据文件，不用动 HTML。 -->
  <section id="control-bar" class="control-bar" aria-label="调控区">
    <div class="ctrl-group">
      <span class="ctrl-label">时间流速</span>
      <div id="ctrl-speed" class="btn-row"></div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">轨道比例</span>
      <div id="ctrl-scale" class="btn-row"></div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">教学对比</span>
      <div class="btn-row">
        <button type="button" id="ctrl-compare" class="btn btn-toggle"
                aria-expanded="false" aria-controls="compare-panel">看公转快慢</button>
      </div>
    </div>
  </section>

  <!-- 教学对比面板：把 8 颗行星的公转周期并排画成条，
       一眼看出「水星 88 天」和「海王星 59800 天」差多少。
       内容由 src/controls.js 生成。

       Day 11：外面套了一层 .compare-wrap —— 因为 hidden 走 display:none，
       而 display 没法做过渡。外层的显隐归脚本管，内层的透明度/位移归 CSS 管，
       这样面板打开时才能有"滑入 + 淡入"的过渡（收起时相反）。
       外层的 hidden 属性仍然保留：脚本不可用时面板默认不挡住页面。 -->
  <div id="compare-wrap" class="compare-wrap" hidden>
    <div id="compare-panel" class="compare-panel"></div>
  </div>

  <!-- 天体目录（Day 8 第 3 步新增）。
       主图上的行星只是几个小圆点，新手未必知道该点哪里；
       这里把 11 个天体列成卡片，点一张等于在图上点了它一次。
       卡片由 src/catalog.js 生成；data-state 决定这一区当前显示什么：
         loading → 转圈 + 「正在读取天体资料…」
         success → 卡片列表
         empty   → 一句"没有资料"
         error   → 一句"没读取成功"
       四种状态的具体样子写在 styles/main.css 里。 -->
  <section id="catalog" class="catalog" aria-labelledby="catalog-title">
    <div class="catalog-head">
      <h2 id="catalog-title" class="catalog-title">天体目录</h2>
      <!-- role="status"（Day 12）：计数一变（共 11 个 → 共 8 个）就让读屏念出来。
           筛出几个是筛选交互的核心信息，看不见它的人也应该知道。 -->
      <span id="catalog-count" class="catalog-count" role="status"></span>
    </div>
    <p class="catalog-sub">点一张卡片，就等于在主图上点了它一次。</p>

    <!-- 筛选条（Day 12）。
         默认 hidden：数据还没读到时留着它没有意义（类型按钮要按真实数据生成），
         而且"加载中/出错"的时候也不该让用户去筛一堆还不存在的东西。
         src/filter.js 拿到数据（catalog:ready 事件）后才把 hidden 撤掉。
         按钮由脚本按数据里**真实出现过**的类型生成 —— 以后加天体，
         类型会自动多出来，不会漏。 -->
    <div id="catalog-filter" class="catalog-filter" hidden>
      <div class="filter-group">
        <span id="filter-type-label" class="filter-label">类型</span>
        <div id="filter-types" class="filter-types" role="group" aria-labelledby="filter-type-label"></div>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filter-search">搜索</label>
        <input id="filter-search" class="filter-input" type="search"
               placeholder="名字，如「木」" autocomplete="off">
      </div>
    </div>

    <div id="catalog-body" class="catalog-body" data-state="loading"
         aria-live="polite" aria-busy="true">
      <ul id="catalog-list" class="catalog-list"></ul>
      <p id="catalog-msg" class="catalog-msg">
        <span class="catalog-wait-dot" aria-hidden="true"></span><span id="catalog-msg-text">正在读取天体资料…</span>
        <!-- 「筛出 0 个」时的出口。只在 data-state="no-match" 时露出来（CSS 管）。
             为什么这个状态给按钮、而"数据源本身为空"（empty）不给 ——
             判据还是 Day 8 那条：用户做点什么有没有用。
             点一下清空就能把东西找回来，所以给；数据源本来就空的话给了也白给。 -->
        <button id="catalog-clear" class="catalog-clear" type="button">清空筛选</button>
      </p>
    </div>
  </section>

  <footer class="page-footer">
    <p>数据来源：NASA Planetary Fact Sheet ／ NASA Sun Fact Sheet（逐条标注见 <code>src/data/bodies.js</code>）</p>
  </footer>

  <!-- 3D 聚焦遮罩（点击天体后出现）。
       canvas 由 src/focus3d.js 生成，Three.js 也是那时才开始加载。 -->
  <div id="focus-overlay" class="focus-overlay" hidden>
    <div class="focus-top">
      <h2 id="focus-title" class="focus-title"></h2>
      <p id="focus-note" class="focus-note"></p>
    </div>
    <button id="focus-close" class="focus-close" type="button" aria-label="关闭 3D 特写">×</button>
    <div id="focus-stage" class="focus-stage"></div>
  </div>

  <!-- 资料卡（点击天体后出现）。
       这里只放空壳，具体内容由 src/scene2d.js 填进去。 -->
  <aside id="body-card" class="body-card" hidden>
    <button id="card-close" class="card-close" type="button" aria-label="关闭资料卡">×</button>
    <h2 id="card-title" class="card-title"></h2>
    <p id="card-type" class="card-type"></p>
    <p class="card-legend">下面的条越长，表示这项数值越大；竖线是地球所在的位置。</p>
    <div id="card-facts" class="card-facts"></div>
    <div id="card-compare" class="card-compare"></div>
    <p id="card-source" class="card-source"></p>
  </aside>

  <script src="src/data/bodies.js"></script>
  <script src="src/fallback.js"></script>
  <!-- states.js 排在主图脚本之前：就算后面哪一个脚本报错，
       状态机也已经在跑，过渡屏仍能按时让路（PRD 5.3 不卡死）。 -->
  <script src="src/states.js"></script>
  <script src="src/scene2d.js"></script>
  <script src="src/catalog.js"></script>
  <!-- filter.js 排在 catalog.js 之后：它靠 catalog.js 发出的
       「目录铺好了」事件拿数据，必须保证监听器先于事件注册。 -->
  <script src="src/filter.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/focus3d.js"></script>

</body>
</html>
